<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FindIt — Butuan City Café Discovery</title>
    <script>
      // Apply the saved theme before first paint
      try {
        var savedTheme = localStorage.getItem("findit.theme");
        if (savedTheme === "dark" || savedTheme === "light")
          document.documentElement.setAttribute("data-theme", savedTheme);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <!-- Stylesheets, in cascade order (tokens and reset first) -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/topbar.css" />
    <link rel="stylesheet" href="css/drawer.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/bottom-nav.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/cards.css" />
    <link rel="stylesheet" href="css/feed.css" />
    <link rel="stylesheet" href="css/map.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <link rel="stylesheet" href="css/notifications.css" />
    <link rel="stylesheet" href="css/owner.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/utilities.css" />
  </head>
  <body>
    <!-- ══════════ ICON SPRITE (2px stroke, used via <use href="#i-…">) ══════════ -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-bell" viewBox="0 0 24 24">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </symbol>
        <symbol id="i-pin" viewBox="0 0 24 24">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
          <circle cx="12" cy="10" r="3" />
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24">
          <path
            d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"
          />
        </symbol>
        <symbol id="i-map" viewBox="0 0 24 24">
          <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z" />
          <path d="M9 4v14M15 6v14" />
        </symbol>
        <symbol id="i-cup" viewBox="0 0 24 24">
          <path d="M5 9h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z" />
          <path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17" />
          <path d="M8 3v2M11.5 3v2M15 3v2" />
        </symbol>
        <symbol id="i-bookmark" viewBox="0 0 24 24">
          <path d="M6 4h12v17l-6-4-6 4z" />
        </symbol>
        <symbol id="i-store" viewBox="0 0 24 24">
          <path d="M4 9v11h16V9" />
          <path
            d="M3 9l1.5-5h15L21 9a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"
          />
          <path d="M10 20v-5h4v5" />
        </symbol>
        <symbol id="i-share" viewBox="0 0 24 24">
          <path d="M12 15V3" />
          <path d="m8 7 4-4 4 4" />
          <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
        </symbol>
        <symbol id="i-back" viewBox="0 0 24 24">
          <path d="M19 12H5" />
          <path d="m12 19-7-7 7-7" />
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24">
          <path d="m15 6-6 6 6 6" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="M18 6 6 18M6 6l12 12" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24">
          <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1" />
          <circle cx="15" cy="6" r="2" />
          <circle cx="9" cy="12" r="2" />
          <circle cx="17" cy="18" r="2" />
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" />
        </symbol>
        <symbol id="i-camera" viewBox="0 0 24 24">
          <path
            d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"
          />
          <circle cx="12" cy="13.5" r="3.5" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="m5 12.5 4.5 4.5L19 7.5" />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </symbol>
        <symbol id="i-star" viewBox="0 0 24 24">
          <path
            d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9l-5.4 2.9 1.1-6.1L3.2 9.4l6.1-.8z"
          />
        </symbol>
        <symbol id="i-route" viewBox="0 0 24 24">
          <path d="M21 3 10 14" />
          <path d="M21 3l-7 18-4-7-7-4z" />
        </symbol>
        <symbol id="i-phone" viewBox="0 0 24 24">
          <path
            d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"
          />
        </symbol>
        <symbol id="i-locate" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="7" />
          <circle cx="12" cy="12" r="2" />
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
        </symbol>
        <symbol id="i-briefcase" viewBox="0 0 24 24">
          <rect x="3" y="7" width="18" height="13" rx="2" />
          <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18" />
        </symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="16" rx="2" />
          <path d="M3 10h18M8 3v4M16 3v4" />
        </symbol>
        <symbol id="i-spark" viewBox="0 0 24 24">
          <path d="M12 3v6M12 15v6M3 12h6M15 12h6" />
        </symbol>
        <symbol id="i-flame" viewBox="0 0 24 24">
          <path
            d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .5 2 1.5 2.5 2 2.5C11 9 10.5 6 12 3z"
          />
        </symbol>
        <symbol id="i-logout" viewBox="0 0 24 24">
          <path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4" />
          <path d="m10 8-4 4 4 4M6 12h10" />
        </symbol>
        <symbol id="i-tag" viewBox="0 0 24 24">
          <path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z" />
          <circle cx="8" cy="8" r="1.5" />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21a8 8 0 0 1 16 0" />
        </symbol>
        <symbol id="i-comment" viewBox="0 0 24 24">
          <path
            d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z"
          />
        </symbol>
        <symbol id="i-bear" viewBox="0 0 24 24">
          <circle cx="6.5" cy="6.5" r="2.5" />
          <circle cx="17.5" cy="6.5" r="2.5" />
          <circle cx="12" cy="13" r="8" />
          <path d="M9 11.5v.5M15 11.5v.5" />
          <path d="M10.5 15.5c.5.8 2.5.8 3 0" />
        </symbol>
      </defs>
    </svg>

    <div id="theme-flash"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- ══════════ FILTER DRAWER ══════════ -->
    <div
      class="drawer-overlay"
      id="drawer-overlay"
    >
      <div class="filter-drawer" role="dialog" aria-modal="true" aria-label="Filters">
        <div class="drawer-pill"></div>
        <div class="drawer-head">
          <div class="drawer-title">Filters</div>
          <button
            class="round-btn"
            data-action="close-drawer"
            aria-label="Close filters"
          >
            <svg class="ico" aria-hidden="true"><use href="#i-close" /></svg>
          </button>
        </div>
        <div class="drawer-grid">
          <button
            class="drawer-card active"
            data-filter="all"
            data-action="pick-filter"
          >
            <svg class="ico" aria-hidden="true"><use href="#i-cup" /></svg>
            All cafés
          </button>
          <button
            class="drawer-card"
            data-filter="findItNearMe"
            data-action="pick-filter"
          >
            <svg class="ico" aria-hidden="true"><use href="#i-pin" /></svg>
            Near me
          </button>
          <button
            class="drawer-card"
            data-filter="findItTrending"
            data-action="pick-filter"
          >
            <svg class="ico" aria-hidden="true"><use href="#i-flame" /></svg>
            Trending
          </button>
          <button
            class="drawer-card"
            data-filter="findItTopRated"
            data-action="pick-filter"
          >
            <svg class="ico" aria-hidden="true"><use href="#i-star" /></svg>
            Top rated
          </button>
          <button
            class="drawer-card"
            data-filter="findItNew"
            data-action="pick-filter"
          >
            <svg class="ico" aria-hidden="true"><use href="#i-spark" /></svg>
            New
          </button>
          <button
            class="drawer-card"
            data-filter="findItPhotos"
            data-action="pick-filter"
          >
            <svg class="ico" aria-hidden="true"><use href="#i-camera" /></svg>
            Photos
          </button>
          <button
            class="drawer-card"
            data-filter="findItPromo"
            data-action="pick-filter"
          >
            <svg class="ico" aria-hidden="true"><use href="#i-tag" /></svg>
            Promos
          </button>
          <button
            class="drawer-card"
            data-filter="findItEvents"
            data-action="pick-filter"
          >
            <svg class="ico" aria-hidden="true">
              <use href="#i-calendar" />
            </svg>
            Events
          </button>
          <button
            class="drawer-card"
            data-filter="findItJob"
            data-action="pick-filter"
          >
            <svg class="ico" aria-hidden="true">
              <use href="#i-briefcase" />
            </svg>
            Hiring
          </button>
        </div>
        <button class="btn btn-accent btn-block" data-action="apply-filter">
          Apply filter
        </button>
      </div>
    </div>

    <!-- ══════════ TOPBAR ══════════ -->
    <header class="topbar">
      <a
        class="logo"
        href="#"
        data-action="show-panel"
        data-panel="home"
        aria-label="FindIt, today"
        >Find<span>It</span></a
      >
      <span class="loc-pill top-loc">
        <svg class="ico sm" aria-hidden="true"><use href="#i-pin" /></svg>
        Butuan City
      </span>
      <div class="topbar-search">
        <label class="search-field">
          <svg class="ico sm" aria-hidden="true"><use href="#i-search" /></svg>
          <input
            type="search"
            id="topbar-search"
            placeholder="Search cafés"
            aria-label="Search cafés"
            data-search
          />
        </label>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" data-action="toggle-alerts-panel" aria-label="Alerts">
          <svg class="ico" aria-hidden="true"><use href="#i-bell" /></svg>
          <span class="badge" id="notif-badge" hidden></span>
        </button>
        <button
          class="icon-btn"
          id="theme-btn"
          data-action="toggle-theme"
          aria-label="Switch theme"
        >
          <svg class="ico" aria-hidden="true">
            <use id="theme-ico" href="#i-moon" />
          </svg>
        </button>
        <button
          class="icon-btn"
          data-action="account"
          aria-label="Account: café owner sign-in"
        >
          <svg class="ico" aria-hidden="true"><use href="#i-user" /></svg>
        </button>
      </div>
    </header>

    <!-- ══════════ ALERTS PANEL ══════════ -->
    <div class="notif-backdrop" id="notif-backdrop">
      <div
        class="notif-panel"
        role="dialog"
        aria-modal="true"
        aria-label="Alerts"
      >
        <div class="notif-head">
          <div class="notif-title">Alerts</div>
          <button
            class="round-btn"
            data-action="close-alerts"
            aria-label="Close alerts"
          >
            <svg class="ico" aria-hidden="true"><use href="#i-close" /></svg>
          </button>
        </div>
        <div class="notif-list" id="notif-list"></div>
      </div>
    </div>

    <!-- ══════════ PAGE WRAPPER ══════════ -->
    <div class="page-wrapper">
      <div class="layout-cols">
        <main class="main-col" id="pages-container">
          <!-- Pages load here (js/page-loader.js) -->
          <div class="panel active" id="panel-home"></div>
          <div class="panel" id="panel-map"></div>
          <div class="panel" id="panel-profile"></div>
          <div class="panel" id="panel-saved"></div>
          <div class="panel" id="panel-owner"></div>
        </main>

        <!-- RIGHT RAIL (desktop) — rendered from the posts -->
        <aside class="side-col" aria-label="This week and now hiring">
          <section class="side-sec" aria-labelledby="side-week-h">
            <h2 class="side-title" id="side-week-h">This week</h2>
            <div class="rail-list" id="side-events"></div>
          </section>
          <section class="side-sec" aria-labelledby="side-jobs-h">
            <h2 class="side-title" id="side-jobs-h">Now hiring</h2>
            <div class="rail-list" id="side-jobs"></div>
          </section>
        </aside>
      </div>
    </div>

    <!-- Dark confirmation bar shown after an owner publishes -->
    <div class="publish-bar" id="publish-bar" role="status" aria-live="polite">
      <svg class="ico" aria-hidden="true"><use href="#i-check" /></svg>
      <span id="publish-bar-text">On the board</span>
      <button class="btn" data-action="view-published">View</button>
    </div>

    <!-- ══════════ BOTTOM NAV ══════════ -->
    <nav class="bottom-nav" aria-label="Main">
      <button class="nav-it on" id="nav-home" data-action="show-panel" data-panel="home" aria-current="page">
        <span class="nav-ico"
          ><svg class="ico" aria-hidden="true"><use href="#i-home" /></svg
        ></span>
        <span class="nav-lbl">Today</span>
      </button>
      <button class="nav-it" id="nav-map" data-action="show-panel" data-panel="map">
        <span class="nav-ico"
          ><svg class="ico" aria-hidden="true"><use href="#i-map" /></svg
        ></span>
        <span class="nav-lbl">Map</span>
      </button>
      <button class="nav-it" id="nav-profile" data-action="show-panel" data-panel="profile">
        <span class="nav-ico"
          ><svg class="ico" aria-hidden="true"><use href="#i-cup" /></svg
        ></span>
        <span class="nav-lbl">Café</span>
      </button>
      <button class="nav-it" id="nav-saved" data-action="show-panel" data-panel="saved">
        <span class="nav-ico"
          ><svg class="ico" aria-hidden="true"><use href="#i-bookmark" /></svg
        ></span>
        <span class="nav-lbl">Saved</span>
      </button>
      <button class="nav-it" id="nav-owner" data-action="show-panel" data-panel="owner">
        <span class="nav-ico"
          ><svg class="ico" aria-hidden="true"><use href="#i-store" /></svg
        ></span>
        <span class="nav-lbl">Owner</span>
      </button>
    </nav>

    <!-- ══════════ SCRIPTS (order matters — see js/README.md) ══════════ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="js/page-loader.js"></script>
    <script src="js/database.js"></script>
    <script src="js/store.js"></script>
    <script src="js/geolocation.js"></script>
    <script src="js/map.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/feed.js"></script>
    <script src="js/search.js"></script>
    <script src="js/filter.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/owner.js"></script>
    <script src="js/actions.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>

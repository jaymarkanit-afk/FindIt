<!-- SIGN-IN GATE -->
<div id="owner-gate">
  <div class="page-head">
    <h1>Owner</h1>
    <p>Sign in to post updates for your café.</p>
  </div>
  <div class="card form-card">
    <div class="fg">
      <label for="ow-email">Business email</label>
      <input
        class="fi"
        type="email"
        id="ow-email"
        placeholder="owner@yourcafe.com"
        autocomplete="email"
      />
    </div>
    <div class="fg">
      <label for="ow-pass">Password</label>
      <input
        class="fi"
        type="password"
        id="ow-pass"
        placeholder="Password"
        autocomplete="current-password"
      />
    </div>
    <button class="btn btn-accent btn-block" data-action="owner-login">
      Sign in
    </button>
    <div class="fg-note">Demo: any email and password works</div>
  </div>
</div>

<!-- COMPOSER -->
<div id="owner-dash" style="display: none">
  <header class="compose-head">
    <button
      class="round-btn"
      data-action="show-panel" data-panel="home"
      aria-label="Close and go back to home"
    >
      <i class="ico" data-icon="close"></i>
    </button>
    <h1>Post an update</h1>
    <button class="btn btn-accent" data-action="publish">Publish</button>
  </header>
  <p class="compose-as">Posting as <strong id="ow-cafe-name"></strong></p>

  <div class="card compose-card">
    <div class="fg">
      <span class="field-label" id="ann-type-label">Post type</span>
      <div class="seg" role="group" aria-labelledby="ann-type-label">
        <button
          class="seg-btn ann-type on"
          data-type="new"
          data-action="ann-type"
        >
          New item
        </button>
        <button class="seg-btn ann-type" data-type="promo" data-action="ann-type">
          Promo
        </button>
        <button class="seg-btn ann-type" data-type="event" data-action="ann-type">
          Event
        </button>
        <button
          class="seg-btn ann-type"
          data-type="hiring"
          data-action="ann-type"
        >
          Hiring
        </button>
      </div>
    </div>

    <label class="photo-drop" id="ann-photo-drop">
      <i class="ico" data-icon="camera"></i>
      <span id="ann-photo-label">Add a photo</span>
      <input
        type="file"
        id="ann-photo"
        accept="image/*"
        aria-label="Add a photo"
      />
    </label>

    <div class="fg">
      <label for="ann-text">Tell your customers</label>
      <textarea
        class="fi"
        id="ann-text"
        maxlength="280"
        placeholder="What's new today?"
      ></textarea>
    </div>

    <!-- Extra fields per post type -->
    <div class="extra-fields" id="extra-promo" hidden>
      <div class="fg wide">
        <label for="ann-until">Valid until</label>
        <input
          class="fi"
          type="date"
          id="ann-until"
        />
      </div>
    </div>

    <div class="extra-fields" id="extra-event" hidden>
      <div class="fg">
        <label for="ann-date">Date</label>
        <input
          class="fi"
          type="date"
          id="ann-date"
        />
      </div>
      <div class="fg">
        <label for="ann-time">Time</label>
        <input
          class="fi"
          type="time"
          id="ann-time"
        />
      </div>
      <div class="fg wide">
        <label for="ann-price">Price</label>
        <input
          class="fi"
          type="text"
          id="ann-price"
          placeholder="Free, or ₱350"
          maxlength="30"
        />
      </div>
    </div>

    <div class="extra-fields" id="extra-hiring" hidden>
      <div class="fg wide">
        <label for="ann-role">Role</label>
        <input
          class="fi"
          type="text"
          id="ann-role"
          placeholder="Barista"
          maxlength="50"
        />
      </div>
      <div class="fg wide">
        <label for="ann-schedule">Schedule</label>
        <input
          class="fi"
          type="text"
          id="ann-schedule"
          placeholder="Part-time · Weekends"
          maxlength="50"
        />
      </div>
    </div>
  </div>

  <label class="card toggle-row">
    <i class="ico" data-icon="bell"></i>
    <span class="toggle-text">
      Send alerts now
      <small>People with alerts on for your café get notified</small>
    </span>
    <input type="checkbox" class="switch" id="ann-alert" checked />
  </label>

  <div class="preview-wrap">
    <span class="sec-label">Preview</span>
    <div id="ann-preview"></div>
  </div>

  <div class="owner-foot">
    <button class="btn btn-ghost" data-action="owner-logout">
      <i class="ico sm" data-icon="logout"></i>
      Sign out
    </button>
  </div>
</div>

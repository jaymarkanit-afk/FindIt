<!-- BREVI BAR -->
<div class="mascot-bar">
  <div class="mascot-ava">
    <svg class="ico" aria-hidden="true"><use href="#i-bear" /></svg>
  </div>
  <div class="mascot-content">
    <div class="mascot-name">BREVI</div>
    <div class="mascot-msg" id="mascot-msg">
      Good day! Here is what Butuan's cafés are up to right now.
    </div>
  </div>
</div>

<!-- FRESH RIGHT NOW -->
<div class="sec">
  <div class="sec-head">
    <h2 class="sec-title">Fresh right now</h2>
  </div>
</div>
<div class="fresh-strip" id="fresh-strip"></div>

<!-- SEGMENTED FILTER -->
<div class="feed-filter">
  <div class="seg" id="feed-filter" role="group" aria-label="Filter updates">
    <button
      class="seg-btn active"
      data-filter="all"
      aria-pressed="true"
      onclick="quickFilter('all', this)"
    >
      All
    </button>
    <button
      class="seg-btn"
      data-filter="findItNew"
      aria-pressed="false"
      onclick="quickFilter('findItNew', this)"
    >
      New
    </button>
    <button
      class="seg-btn"
      data-filter="findItEvents"
      aria-pressed="false"
      onclick="quickFilter('findItEvents', this)"
    >
      Events
    </button>
    <button
      class="seg-btn"
      data-filter="findItJob"
      aria-pressed="false"
      onclick="quickFilter('findItJob', this)"
    >
      Hiring
    </button>
  </div>
</div>

<!-- SEARCH RESULTS (only while a search is active) -->
<div id="search-results" hidden>
  <span class="sec-label" id="smart-title">Cafés</span>
  <div class="rec-stack" id="smart-recs"></div>
</div>

<!-- FEED -->
<div class="feed" id="feed" aria-label="Café updates"></div>

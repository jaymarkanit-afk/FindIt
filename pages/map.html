<div class="page-head">
  <h1>Map</h1>
  <p>Cafés around Butuan City</p>
</div>

<div class="map-search">
  <label class="search-field">
    <i class="ico sm" data-icon="search"></i>
    <input
      type="search"
      id="map-search"
      placeholder="Search cafés"
      aria-label="Search cafés"
      data-search
    />
  </label>
  <button class="btn btn-ghost" data-action="open-drawer">
    <i class="ico sm" data-icon="sliders"></i>
    Filters
  </button>
</div>

<!-- LOCATION STRIP -->
<div class="geo-strip">
  <button
    class="geo-where"
    data-action="zoom-to-me"
    aria-label="Zoom the map to your location"
  >
    <i class="ico" data-icon="pin"></i>
    <span class="geo-text">
      <span class="geo-location" id="geo-location">Butuan City</span>
      <span class="geo-stats">
        <span id="geo-cafe-count">–</span> cafés · nearest
        <span id="geo-nearest-dist">–</span>
        <span class="dist-from"></span>
      </span>
    </span>
  </button>
  <button class="btn btn-dark" data-action="locate">Locate me</button>
</div>

<div class="map-container">
  <div id="butuan-map" class="osm-map"></div>
  <button
    class="round-btn map-locate"
    data-action="locate"
    aria-label="Locate me"
  >
    <i class="ico" data-icon="locate"></i>
  </button>
</div>

<!-- NEARBY CAFÉS -->
<div class="sec">
  <div class="sec-head">
    <h2 class="sec-title">Nearby <span class="dist-from"></span></h2>
  </div>
</div>
<div class="nearby-cafes-list" id="nearby-cafes-list"></div>

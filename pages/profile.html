<!-- BACK / SHARE ROW (above the gallery, never on top of a photo) -->
<div class="pf-bar">
  <button
    class="round-btn"
    data-action="show-panel" data-panel="home"
    aria-label="Back to home"
  >
    <i class="ico" data-icon="back"></i>
  </button>
  <button class="round-btn" data-action="share-cafe" aria-label="Share this café">
    <i class="ico" data-icon="share"></i>
  </button>
</div>

<!-- FEATURED GALLERY (rendered by js/profile.js from the café's images) -->
<div id="pf-gallery"></div>

<!-- INFO CARD -->
<section class="card pf-card">
  <div class="pf-top">
    <span id="pf-tile"></span>
    <div>
      <h1 class="profile-name"></h1>
      <p class="pf-address" id="pf-address"></p>
    </div>
  </div>
  <div class="pf-facts">
    <span id="pf-rating"></span>
    <span id="pf-open" hidden></span>
  </div>
  <div class="pf-tags" id="pf-tags"></div>
  <div class="pf-actions">
    <button
      class="alert-btn"
      id="pf-alert"
      data-cafe=""
      aria-pressed="false"
      data-action="toggle-alerts"
    >
      <i class="ico sm" data-icon="bell"></i>
      <span class="alert-label">Get alerts</span>
    </button>
    <button class="btn btn-ghost" data-action="directions">
      <i class="ico sm" data-icon="route"></i>
      Directions
    </button>
    <button
      class="icon-btn"
      id="pf-save"
      aria-label="Save this café"
      aria-pressed="false"
      data-action="save-cafe"
    >
      <i class="ico" data-icon="bookmark"></i>
    </button>
  </div>
</section>

<!-- TABS -->
<div class="seg pf-tabs" role="group" aria-label="Café sections">
  <button
    class="seg-btn ptab on"
    data-tab="today"
    aria-pressed="true"
    data-action="profile-tab"
  >
    Today
  </button>
  <button
    class="seg-btn ptab"
    data-tab="photos"
    aria-pressed="false"
    data-action="profile-tab"
  >
    Photos
  </button>
  <button
    class="seg-btn ptab"
    data-tab="info"
    aria-pressed="false"
    data-action="profile-tab"
  >
    Info
  </button>
</div>

<div class="tab-content on" id="tab-today">
  <section class="board">
    <h2>On the board today</h2>
    <ul id="pf-board"></ul>
  </section>
</div>

<div class="tab-content" id="tab-photos"></div>

<div class="tab-content" id="tab-info">
  <dl class="card info-list" id="pf-info"></dl>
</div>

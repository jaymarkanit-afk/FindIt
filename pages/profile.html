<!-- BACK / SHARE ROW -->
<div class="pf-bar">
  <button
    class="round-btn"
    data-action="show-panel" data-panel="home"
    aria-label="Back to home"
  >
    <i class="ico" data-icon="back"></i>
  </button>
  <button class="round-btn" data-action="share-cafe" aria-label="Share this café">
    <i class="ico" data-icon="share"></i>
  </button>
</div>

<!-- 1. INFO CARD: who the café is, first -->
<section class="card pf-card">
  <div class="pf-top">
    <span id="pf-tile"></span>
    <div>
      <h1 class="profile-name"></h1>
      <p class="pf-address" id="pf-address"></p>
    </div>
  </div>
  <div class="pf-facts">
    <span id="pf-rating"></span>
    <span id="pf-open" hidden></span>
  </div>
  <div class="pf-tags" id="pf-tags"></div>
  <div class="pf-actions">
    <button
      class="alert-btn"
      id="pf-alert"
      data-cafe=""
      aria-pressed="false"
      data-action="toggle-alerts"
    >
      <i class="ico sm" data-icon="bell"></i>
      <span class="alert-label">Get alerts</span>
    </button>
    <button class="btn btn-ghost" data-action="directions">
      <i class="ico sm" data-icon="route"></i>
      Directions
    </button>
    <button
      class="icon-btn"
      id="pf-save"
      aria-label="Save this café"
      aria-pressed="false"
      data-action="save-cafe"
    >
      <i class="ico" data-icon="bookmark"></i>
    </button>
  </div>
</section>

<!-- 2. ON THE BOARD TODAY -->
<section class="pf-section board" aria-labelledby="pf-board-h">
  <h2 id="pf-board-h">On the board today</h2>
  <ul id="pf-board"></ul>
</section>

<!-- 3. PHOTOS — the only place photos appear on this page -->
<section class="pf-section" aria-labelledby="pf-photos-h">
  <div class="pf-sec-head">
    <h2 class="pf-sec-title" id="pf-photos-h">
      Photos <span class="pf-count" id="pf-photo-count"></span>
    </h2>
    <button
      class="text-btn"
      id="pf-photos-toggle"
      aria-expanded="false"
      aria-controls="pf-photos"
      data-action="toggle-photos"
      hidden
    >
      See all
    </button>
  </div>
  <div id="pf-photos"></div>
</section>

<!-- 4. INFO — hidden when it would only repeat the address -->
<section class="pf-section" id="pf-info-section" aria-labelledby="pf-info-h">
  <h2 class="pf-sec-title" id="pf-info-h">Info</h2>
  <dl class="card info-list" id="pf-info"></dl>
</section>
